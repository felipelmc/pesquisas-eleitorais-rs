<meta name="color-scheme" content="light dark">
<script>
/* tema antes da primeira pintura, para não piscar; leitura do localStorage dentro de try/catch */
(function () {
  try {
    var t = localStorage.getItem('vitrine-tema');
    if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-theme', t === 'claro' ? 'light' : 'dark');
    if (localStorage.getItem('vitrine-movimento') === 'reduzido') document.documentElement.setAttribute('data-movimento', 'reduzido');
  } catch (e) { /* sem armazenamento: segue o sistema */ }
  document.documentElement.classList.add('js');
})();
</script>
