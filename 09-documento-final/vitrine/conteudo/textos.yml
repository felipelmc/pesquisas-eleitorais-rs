    suplemento: "Suplemento"
    apoio: "Para ir além"

contagem:
  kicker: "Segunda leitura"
  titulo: "Contando a direção"
  intro: >-
    Para cada célula, a proporção de estudos que apontam na direção positiva, com o intervalo de confiança de
    Clopper-Pearson. A linha em 0,5 marca o empate. O selo de certeza só aparece onde há julgamento GRADE próprio.
  legenda: "Proporção de estudos na direção positiva por célula, com IC 95%, conforme a análise escolhida."
  eixo: "proporção de estudos na direção positiva"
  post_hoc: "*Post hoc*: agrupamento decidido depois de ver os dados, só descritivo."
  sem_grade: "sem GRADE próprio"
  nota_sem_grade: "Esta análise não tem julgamento GRADE próprio; por isso, não leva selo de certeza."
  so_nulo: "só estimativa nula dentro de ±δ"
  sem_estudo: "sem estudo"
  nota_real: >-
    Com só contexto real, o grupo randomizado de apoio fica com {{numeros.real_apoio_rand_k}} estudo
    ({{numeros.real_apoio_rand_estudos}}).

forest:
  kicker: "Magnitude"
  titulo: "De quanto?"
  intro: >-
    Duas células tinham efeitos suficientes para uma meta-análise exploratória. Os números abaixo não são efeito
    médio: com menos de 4 graus de liberdade, a variância robusta não é confiável, e o intervalo de predição cobre
    efeitos nas duas direções.
  carimbo: "Exploratória: menos de 4 gl, RVE não confiável"
  tyszler: "Os dois efeitos de {{numeros.tyszler_rotulo}} foram lidos de figura. A certeza de cada meta é a da célula: muito baixa."
  legenda: "g de Hedges por efeito, com IC 95%, e a estimativa combinada (losango vazado). A faixa cinza marca ±δ."
  loo: "Deixando um estudo de fora"
  loo_sem: "sem"
  loo_muda: "o IC deixa de cruzar zero"
  delta: "faixa de ±δ"

rob:
  kicker: "Qualidade"
  titulo: "Quão confiáveis são os estudos?"
  intro: >-
    Risco de viés por ferramenta e domínio, em {{numeros.rob_resultados}} resultados avaliados. Dois avaliadores de
    IA julgaram cada domínio, e um árbitro de IA resolveu os {{numeros.rob_arbitro}} desacordos.
  nota: "Nenhum julgamento foi validado por humano."
  nota_epoc: "* Fora do julgamento geral do EPOC (Emenda 4a)."
  legenda: "Distribuição dos julgamentos de risco de viés por domínio, por ferramenta."
  geral: "Geral"

