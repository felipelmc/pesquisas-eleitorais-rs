# Textos editoriais da vitrine (docs/index.html), na voz do autor.
#
# Regras
# - Números só por marcador {{bloco.campo}}, resolvido por montar_vitrine.py a partir de build/vitrine.json
#   (bloco "numeros" ou "meta"). Marcador sem valor faz a montagem falhar.
# - *termo* vira <i lang="en">termo</i> (itálico só para termo em inglês); **x** vira <strong>; `x` vira <code>;
#   [texto](#ancora) vira link.
# - Nada de enunciado de célula, certeza ou direção digitados aqui: eles vêm de celulas.json pela página.
# - Proibidos: "Neutro", "sem efeito", "benéfic", "danos", "significativ", travessão longo.
# - Linha do tempo do Brasil: cada item traz "confirmar", um trecho literal de insumos/contexto_brasil.md
#   (ou de 00-protocolo/emendas.md, quando indicado); a montagem falha se o trecho não estiver lá.

barra:
  texto: "Rascunho não validado · {{numeros.pendencias}} pendências humanas abertas"
  link: "ver o que falta"

ferramentas:
  tema_claro: "Tema claro"
  tema_escuro: "Tema escuro"
  movimento: "Reduzir animações"
  pular: "Pular para o conteúdo"

heroi:
  kicker: "Revisão sistemática rápida · versão de trabalho"
  autoria: "Felipe Lamarca · MAPE/IESP-UERJ"
  lede: >-
    Reunimos os estudos causais publicados desde {{numeros.ano_min}} sobre o que acontece com o voto e com o
    comparecimento quando o eleitor vê o resultado de uma pesquisa eleitoral. A direção mais frequente é o
    *bandwagon*, o apoio a quem aparece à frente. A certeza, no entanto, é muito baixa em quase todas as células,
    e não sabemos de quanto é o efeito.
  contadores:
    registros: "registros identificados nas bases e na busca por citações"
    estudos: "estudos incluídos"
    relatos: "relatos"
    efeitos: "efeitos extraídos"
    celulas: "células de síntese"
    certeza: "com certeza muito baixa"
  pontos: "Cada ponto é um dos {{numeros.estudos}} estudos incluídos."

mensagens:
  kicker: "Em resumo"
  titulo: "Mensagens principais"
  provisorio: "Provisório: estas são as mensagens da versão de {{numeros.data_versao}}. Elas serão trocadas pelas do artigo novo assim que ele ficar pronto."
  ler: "Ler no artigo"

linguagem:
  kicker: "Sem jargão"
  titulo: "Em linguagem simples"
  provisorio: "Provisório: enquanto o resumo em linguagem simples não fica pronto, esta seção mostra o resumo executivo da versão anterior."

prisma:
  kicker: "Seleção"
  titulo: "Dos registros aos estudos"
  intro: >-
    Partimos de {{numeros.registros_bases}} registros das bases e de {{numeros.registros_citacoes}} da busca por
    citações. Ao fim da triagem e da leitura do texto completo, sobraram {{numeros.relatos}} relatos, que descrevem
    {{numeros.estudos}} estudos. As faixas cinzas saem do fluxo em cada etapa.
  legenda: "Fluxo dos registros, da identificação à inclusão, nos dois ramos da busca. A largura de cada faixa é proporcional ao número de registros."
  alternar: "Ver o diagrama PRISMA 2020"
  alternar_voltar: "Ver o fluxo"
  legenda_diagrama: "Diagrama PRISMA 2020 redesenhado a partir das contagens calculadas pelo script do projeto."
  continuacao_titulo: "Nem todo estudo incluído entra na síntese principal"
  continuacao_intro: >-
    Dos {{numeros.estudos}} estudos, {{numeros.estudos_sintese}} entram na síntese principal. Os outros aparecem com
    nome e motivo na seção [Estudo a estudo](#estudo-a-estudo).
  legenda_continuacao: "Dos estudos incluídos aos estudos da síntese principal, com as saídas de cada etapa."
  nota_automacao: "Remoção automática: filtro de ano de publicação aplicado por script, antes da triagem. Não é triagem por IA."

legenda_leitura:
  titulo: "Como ler"
  direcao: "Direção da estimativa"
  certeza: "Certeza (GRADE)"
  certeza_nota: "Quanto mais apagado o preenchimento, menor a certeza. O contorno é sempre forte."
  rob: "Risco de viés"

mapa:
  kicker: "A evidência"
  titulo: "Mapa de evidências"
  intro: >-
    Cada símbolo é um estudo dentro de uma célula da síntese, com a cor da direção para a qual a estimativa aponta.
    As células separam o que os estudos comparam: mostrar ou não uma pesquisa, mostrar o mesmo candidato à frente
    ou atrás, antes e depois de uma proibição. Clique numa célula do mapa para ver o enunciado, as contagens e os
    estudos.
  legenda: "Estudos por bloco de desfecho e classe de desenho, com a direção de cada estudo e a certeza de cada célula."
  lacuna: "Lacuna: nenhum estudo"
  vazia: "sem estudo na análise principal"
  abrir: "Abrir detalhes"
  caixa_nota: "Na caixa de ferramentas, as {{numeros.celulas_inconclusivo}} células estão como Inconclusivo."
  nota_momentum: "Pesquisas que mostram um partido ganhando ou perdendo apoio, sem mostrar a posição dele, ficam num bloco próprio."

gaveta:
  enunciado: "Enunciado"
  contagem: "Contagem de direção"
  ic: "Proporção na direção positiva, IC 95% de Clopper-Pearson"
  p: "Teste de sinal"
  sem_p: "sem teste de sinal: nenhum estudo com direção definida"
  rebaixamentos: "Rebaixamentos da certeza"
  partida: "ponto de partida"
  estudos: "Estudos"
  critico: "Fora da análise principal por risco de viés crítico:"
  caixa: "Caixa de ferramentas"
  artigo: "Ler a seção no artigo"
  fechar: "Fechar"
  validacao: "Julgamentos de IA, sem validação humana."

direcao:
  kicker: "Estudo a estudo"
  titulo: "Para que lado aponta cada estudo"
  intro: >-
    Uma linha por estudo em cada célula, no estilo dos gráficos de direção do efeito. O símbolo mostra a direção
    do estudo; o losango marca estudo misto, e o anel, estimativa nula dentro de ±δ. O tamanho do símbolo é o mesmo
    para todos, porque o n de cada estudo tem unidade própria.
  legenda: "Direção do efeito principal por estudo, agrupada pela célula da síntese, com o risco de viés geral."
  filtros: "Filtrar"
  todos: "todos"
  f_exposicao: "Exposição"
  f_desfecho: "Desfecho"
  f_desenho: "Desenho"
  f_contexto: "Contexto"
  f_regiao: "Região"
  mostrar_fora: "Mostrar os estudos fora da síntese principal"
  fora_titulo: "Fora da síntese principal"
  fora_intro: "Estes estudos aparecem só nas sensibilidades e na leitura de mecanismos. A direção vem do agrupamento amplo."
  vivo: "Mostrando {n} linhas de {e} estudos."
  vazio: "Nenhum estudo com esses filtros."

nao_sabemos:
  kicker: "Limites"
  titulo: "O que a evidência não permite dizer"
  cartoes:
    - titulo: "De quanto é o efeito"
      texto: >-
        A síntese conta para que lado apontam os estudos. Ela não mede tamanhos. As duas meta-análises
        exploratórias têm intervalos que cruzam zero e menos de 4 graus de liberdade.
      alvo: "#de-quanto"
      rotulo_alvo: "Ver as metas exploratórias"
    - titulo: "Se o efeito aparece fora do laboratório"
      texto: >-
        Quase todos os experimentos na direção *bandwagon* usaram laboratório ou candidatos hipotéticos. Quando
        ficamos só com contextos reais, o grupo randomizado de apoio cai de {{numeros.amplo_apoio_rand_k}} estudos
        para {{numeros.real_apoio_rand_k}}.
      alvo: "#contando"
      rotulo_alvo: "Ver a sensibilidade"
      destaque: "apoio_principal"
    - titulo: "O que acontece no Brasil"
      texto: >-
        O único estudo brasileiro, {{numeros.araujo_rotulo}}, trata da apuração parcial oficial, e não de pesquisa.
        Um estudo com {{numeros.lago_paises}} países inclui o Brasil, mas fica fora da contagem.
      alvo: "#onde"
      rotulo_alvo: "Ver os países"
    - titulo: "Que as pesquisas não têm efeito"
      texto: >-
        Ausência de evidência não é evidência de ausência. Célula com poucos estudos e certeza muito baixa não
        autoriza dizer que o efeito é zero, e há uma lacuna inteira no mapa.
      alvo: "#mapa"
      rotulo_alvo: "Ver a lacuna no mapa"
      destaque: "lacuna"
    - titulo: "Se as regras de divulgação devem mudar"
      texto: >-
        Sozinha, a evidência não sustenta restringir nem manter as regras atuais. As {{numeros.celulas_inconclusivo}}
        células estão como Inconclusivo na caixa de ferramentas.
      alvo: "#mapa"
      rotulo_alvo: "Ver o mapa"

pendencias:
  kicker: "O que falta"
  titulo: "Pendências humanas"
  intro: >-
    Todas as etapas depois do protocolo foram feitas por agentes de IA. Cada pendência abaixo é uma conferência que
    só uma pessoa pode fechar, e, enquanto houver uma aberta, tudo nesta página é rascunho.
  medidor: "{{numeros.pendencias_fechadas}} de {{numeros.pendencias}} fechadas"
  guia: "Guia da revisão humana"
  esforco: "esforço estimado"

