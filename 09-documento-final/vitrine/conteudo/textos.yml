  titulo: "Contando a direção"
  intro: >-
    Para cada célula, o gráfico mostra a proporção de estudos que apontam na direção positiva, com o intervalo de
    confiança de Clopper-Pearson, e a linha em 0,5 marca o empate. O selo de certeza só aparece onde há julgamento
    GRADE próprio.
  legenda: "Proporção de estudos na direção positiva por célula, com IC 95%, conforme a análise escolhida."
