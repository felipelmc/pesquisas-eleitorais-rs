    Aprovamos a pergunta e o protocolo, e os portões seguintes foram aprovados em modo automático; no fim,
    conferimos em bloco partes da busca, da seleção e da extração e aprovamos o relato (Emenda 7). A deduplicação
    foi aplicada depois (Emenda 8).
  nota: "O log registrava decisões de triagem como humanas, e a Emenda 6a corrigiu esse registro."
  legenda: "Portões, emendas e saídas finais de script ao longo da síntese, por quem decidiu (horário do log, UTC)."
