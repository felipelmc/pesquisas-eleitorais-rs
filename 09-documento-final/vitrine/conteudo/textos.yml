brasil:
  kicker: "Contexto"
  titulo: "A controvérsia no Brasil"
  intro: >-
    As regras de divulgação de pesquisas voltam ao debate a cada eleição em que o resultado das urnas se afasta das
    estimativas. Cada evento abaixo foi conferido em fonte primária.
  itens:
    - ano: 1997
      texto: "A Lei das Eleições (Lei nº 9.504) passa a exigir o registro de cada pesquisa na Justiça Eleitoral antes da divulgação."
      confirmar: "Lei nº 9.504, de 30 de setembro de 1997"
    - ano: 2006
      texto: "A minirreforma eleitoral (Lei nº 11.300) veda a divulgação de pesquisas a partir do décimo quinto dia anterior ao pleito."
      confirmar: "a partir do décimo quinto dia anterior"
    - ano: 2006
      texto: "O STF julga a ADI 3.741 e derruba a vedação, com base no direito do eleitor à informação."
      confirmar: "configurava restrição ao direito dos eleitores à informação"
    - ano: 2018
      texto: "Eleitores de urnas atrasadas seguem votando enquanto a apuração parcial oficial já é divulgada. O único estudo brasileiro incluído trata desse caso."
      confirmar: "apuração parcial oficial divulgada em 2018"
      fonte_confirmar: "09-documento-final/_revisao_final_v1_oqf.qmd"
    - ano: 2019
      texto: "O TSE edita a Resolução nº 23.600, que regula registro e divulgação de pesquisas e segue vigente com alterações."
      confirmar: "Resolução-TSE nº 23.600, de 12 de dezembro de 2019"
    - ano: 2022
      texto: "O primeiro turno diverge das estimativas de vários institutos. Projetos de lei na Câmara (PL nº 2.567/2022) e no Senado (PL nº 2.558/2022) propõem punir institutos cujas pesquisas saiam da margem de erro."
      confirmar: "Após o primeiro turno das eleições de 2022"

