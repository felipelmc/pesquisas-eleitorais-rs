# Textos editoriais da vitrine (docs/index.html), na voz do autor.
#
# Regras
# - Números só por marcador {{bloco.campo}}, resolvido por montar_vitrine.py a partir de build/vitrine.json
#   (bloco "numeros" ou "meta"). Marcador sem valor faz a montagem falhar.
# - *termo* vira <i lang="en">termo</i> (itálico só para termo em inglês); **x** vira <strong>; `x` vira <code>;
#   [texto](#ancora) vira link.
# - Nada de enunciado de célula, certeza ou direção digitados aqui: eles vêm de celulas.json pela página.
# - Proibidos: "Neutro", "sem efeito", "benéfic", "danos", "significativ", travessão longo.
# - Linha do tempo do Brasil: cada item traz "confirmar", um trecho literal de insumos/contexto_brasil.md
#   (ou de 00-protocolo/emendas.md, quando indicado); a montagem falha se o trecho não estiver lá.

ferramentas:
  tema_claro: "Tema claro"
  tema_escuro: "Tema escuro"
  movimento: "Reduzir animações"
  pular: "Pular para o conteúdo"

heroi:
  kicker: "Síntese sistemática de evidências · conduzida com agentes de IA"
  autoria: "Felipe Lamarca · MAPE/IESP-UERJ e Lucas Berti · IESP-UERJ"
  lede: >-
    Reunimos os estudos causais publicados desde {{numeros.ano_min}} sobre o que acontece com o voto e com o
    comparecimento quando o eleitor vê o resultado de uma pesquisa eleitoral. A direção mais frequente é o
    *bandwagon* (o apoio a quem aparece à frente). A despeito disso, a certeza é muito baixa em quase todas as
    células, e não sabemos de quanto é o efeito.
  contadores:
    registros: "registros identificados nas bases e na busca por citações"
    estudos: "estudos incluídos"
    relatos: "relatos"
    efeitos: "efeitos extraídos"
    celulas: "células de síntese"
    certeza: "com certeza muito baixa"
  pontos: "Cada ponto é um dos {{numeros.estudos}} estudos incluídos."

mensagens:
  kicker: "Em resumo"
  titulo: "Mensagens principais"
  provisorio: "Estas mensagens são provisórias e vêm da versão de {{numeros.data_versao}}. Quando o artigo novo ficar pronto, entram as dele."
  ler: "Ler no artigo"

linguagem:
  kicker: "Sem jargão"
  titulo: "Em linguagem simples"
  provisorio: "Enquanto o resumo em linguagem simples não fica pronto, esta seção mostra o resumo executivo da versão anterior."

prisma:
  kicker: "Seleção"
  titulo: "Dos registros aos estudos"
  intro: >-
    Partimos de {{numeros.registros_bases}} registros das bases e de {{numeros.registros_citacoes}} da busca por
    citações. Depois da triagem e da leitura do texto completo, ficaram {{numeros.relatos}} relatos, que descrevem
    {{numeros.estudos}} estudos. As faixas cinzas mostram o que sai do fluxo em cada etapa.
  legenda: "Fluxo dos registros, da identificação à inclusão, nos dois ramos da busca. A largura de cada faixa é proporcional ao número de registros."
  alternar: "Ver o diagrama PRISMA 2020"
  alternar_voltar: "Ver o fluxo"
  legenda_diagrama: "Diagrama PRISMA 2020 redesenhado a partir das contagens calculadas pelo script do projeto."
  continuacao_titulo: "Nem todo estudo incluído entra na síntese principal"
  continuacao_intro: >-
    Dos {{numeros.estudos}} estudos, {{numeros.estudos_sintese}} entram na síntese principal. Os demais aparecem,
    com nome e motivo, na seção [Estudo a estudo](#estudo-a-estudo).
  legenda_continuacao: "Dos estudos incluídos aos estudos da síntese principal, com as saídas de cada etapa."
  nota_automacao: "A remoção automática é um filtro de ano de publicação, aplicado por script antes da triagem, e não uma triagem por IA."

legenda_leitura:
  titulo: "Como ler"
  direcao: "Direção da estimativa"
  certeza: "Certeza (GRADE)"
  certeza_nota: "Quanto mais apagado o preenchimento, menor a certeza. O contorno é sempre forte."
  rob: "Risco de viés"

mapa:
  kicker: "A evidência"
  titulo: "Mapa de evidências"
  intro: >-
    Cada símbolo é um estudo dentro de uma célula da síntese, colorido pela direção para a qual a estimativa aponta.
    As células separam os estudos pelo que eles comparam: (i) mostrar ou não uma pesquisa; (ii) mostrar o mesmo
    candidato à frente ou atrás; e (iii) o antes e o depois de uma proibição. Clique numa célula do mapa para ver o
    enunciado, as contagens e os estudos.
  legenda: "Estudos por bloco de desfecho e classe de desenho, com a direção de cada estudo e a certeza de cada célula."
  lacuna: "Lacuna: nenhum estudo"
  vazia: "sem estudo na análise principal"
  abrir: "Abrir detalhes"
  caixa_nota: "Pela regra da caixa de ferramentas, com a certeza julgada só por IA, as {{numeros.celulas_inconclusivo}} células ficam como Inconclusivo."
  nota_momentum: "Pesquisas que mostram um partido ganhando ou perdendo apoio, sem mostrar a posição dele, ficam num bloco próprio."

gaveta:
  enunciado: "Enunciado"
  contagem: "Contagem de direção"
  ic: "Proporção na direção positiva, IC 95% de Clopper-Pearson"
  p: "Teste de sinal"
  sem_p: "sem teste de sinal, porque nenhum estudo tem direção definida"
  rebaixamentos: "Rebaixamentos da certeza"
  partida: "ponto de partida"
  estudos: "Estudos"
  critico: "Fora da análise principal por risco de viés crítico:"
  caixa: "Caixa de ferramentas"
  artigo: "Ler a seção no artigo"
  fechar: "Fechar"
  validacao: "Julgamentos de IA, sem validação humana."

direcao:
  kicker: "Estudo a estudo"
  titulo: "Para que lado aponta cada estudo"
  intro: >-
    Há uma linha por estudo em cada célula, no estilo dos gráficos de direção do efeito, e o símbolo mostra a
    direção do estudo: o losango marca estudo misto, e o anel, estimativa nula dentro de ±δ. Note que o símbolo
    tem o mesmo tamanho para todos os estudos, porque o n de cada um tem unidade própria.
  legenda: "Direção do efeito principal por estudo, agrupada pela célula da síntese, com o risco de viés geral."
  filtros: "Filtrar"
  todos: "todos"
  f_exposicao: "Exposição"
  f_desfecho: "Desfecho"
  f_desenho: "Desenho"
  f_contexto: "Contexto"
  f_regiao: "Região"
  mostrar_fora: "Mostrar os estudos fora da síntese principal"
  fora_titulo: "Fora da síntese principal"
  fora_intro: "Estes estudos entram só nas análises de sensibilidade e na leitura de mecanismos. A direção de cada um vem do agrupamento amplo."
  vivo: "Mostrando {n} linhas de {e} estudos."
  vazio: "Nenhum estudo com esses filtros."

nao_sabemos:
  kicker: "Limites"
  titulo: "O que a evidência não permite dizer"
  cartoes:
    - titulo: "De quanto é o efeito"
      texto: >-
        A síntese conta para que lado apontam os estudos, mas não mede de quanto é o efeito. As duas
        meta-análises exploratórias têm intervalos que cruzam o zero e menos de 4 graus de liberdade.
      alvo: "#de-quanto"
      rotulo_alvo: "Ver as metas exploratórias"
    - titulo: "Se o efeito aparece fora do laboratório"
      texto: >-
        Quase todos os experimentos na direção *bandwagon* foram feitos em laboratório ou com candidatos
        hipotéticos. Quando ficamos só com contextos reais, o grupo randomizado de apoio cai de
        {{numeros.amplo_apoio_rand_k}} estudos para {{numeros.real_apoio_rand_k}}.
      alvo: "#contando"
      rotulo_alvo: "Ver a sensibilidade"
      destaque: "apoio_principal"
    - titulo: "O que acontece no Brasil"
      texto: >-
        O único estudo brasileiro, {{numeros.araujo_rotulo}}, trata da apuração parcial oficial, e não de pesquisa
        eleitoral. Há também um estudo com {{numeros.lago_paises}} países que inclui o Brasil, mas ele fica fora da
        contagem.
      alvo: "#onde"
      rotulo_alvo: "Ver os países"
    - titulo: "Que as pesquisas não têm efeito"
      texto: >-
        Uma célula com poucos estudos e certeza muito baixa não autoriza dizer que o efeito é zero. E há uma
        lacuna inteira no mapa.
      alvo: "#mapa"
      rotulo_alvo: "Ver a lacuna no mapa"
      destaque: "lacuna"
    - titulo: "Se as regras de divulgação devem mudar"
      texto: >-
        Sozinha, a evidência não sustenta restringir nem manter as regras atuais. Na caixa de ferramentas, as
        {{numeros.celulas_inconclusivo}} células estão como Inconclusivo.
      alvo: "#mapa"
      rotulo_alvo: "Ver o mapa"

como_foi_feita:
  kicker: "A ferramenta"
  titulo: "Como esta síntese foi feita"
  paragrafos:
    - >-
      Parte do trabalho foi construir a ferramenta que conduziu a síntese. Um de nós, Felipe Lamarca, desenvolveu
      para o Claude Code, com apoio de agentes de IA, a *skill* `revisao-sistematica`, que divide o trabalho entre
      pessoas, modelos de linguagem e *scripts*. Um coordenador de IA distribui as tarefas em volume, como triar
      registros e ler textos completos, entre subagentes, enquanto aos *scripts* cabe o que não pede julgamento, como
      a deduplicação e as contas da síntese. Já o que pede julgamento humano vira uma pendência. Cada comando fica num
      registro que só aceita acréscimos.
    - >-
      O [livro de método](https://felipelamarca.com/Systematic-Review/) que especifica a *skill*, com as regras de
      cada etapa, parte da proposta "O que funciona?" e a estende com as normas de Cochrane, Campbell, PRISMA e
      GRADE. A cópia da *skill* usada aqui vai no [pacote de replicação](pacote-replicacao.zip).
  portoes_intro: "Cada etapa termina num portão, isto é, num ponto de aprovação antes da etapa seguinte:"
  portoes:
    - "**G1**: a pergunta"
    - "**G2**: o protocolo"
    - "**G3**: a busca"
    - "**G4**: a triagem de títulos e resumos"
    - "**G5**: a elegibilidade no texto completo"
    - "**G6**: o piloto de extração"
    - "**G7**: a extração e o risco de viés"
    - "**G8**: a síntese e a certeza da evidência"
    - "**G9**: o relato"
  portoes_nota: >-
    Nesta síntese, aprovamos G1 e G2. De G3 a G9, os portões foram aprovados em autopiloto, quando as
    conferências automáticas passavam, e confirmamos depois G3, G5, G6 e G9; G4, G7 e G8 seguem sem
    confirmação humana.

pendencias:
  kicker: "Validação humana"
  titulo: "O que ficou sem validação humana"
  intro: >-
    Agentes de IA conduziram as etapas depois do protocolo. Em 30/09/2026, conferimos juntos em bloco, sem dupla
    independente, partes da busca, da seleção e da extração, aprovamos o relato e fechamos as pendências dessas
    etapas; a deduplicação que decidimos foi aplicada (Emenda 8). As pendências abaixo continuam abertas: estamos
    revendo o risco de viés e a certeza, que foram julgados por IA, e a triagem não teve validação cega.
  medidor: "{{numeros.pendencias_fechadas}} de {{numeros.pendencias_total}} fechadas"
  guia: "Etapas sem validação humana (Apêndice G)"
  esforco: "esforço estimado"

