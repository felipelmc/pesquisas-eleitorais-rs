  legenda: "Número de estudos incluídos por país."
  brasil_nota: "1 estudo, sobre apuração parcial oficial, não sobre pesquisa."
  multinacional: "multinacional"
  multinacional_nota: "inclui o Brasil; fica fora da contagem"
  nao_relatado: "país não relatado"
  um_estudo: "Um estudo cada"

