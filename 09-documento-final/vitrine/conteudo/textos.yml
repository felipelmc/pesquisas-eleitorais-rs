forest:
  kicker: "Magnitude"
  titulo: "De quanto?"
  intro: >-
    Duas células tinham efeitos suficientes para uma meta-análise exploratória, mas os números abaixo não são um
    efeito médio: com menos de 4 graus de liberdade, a variância robusta não é confiável, e o intervalo de predição
    cobre efeitos nas duas direções.
  carimbo: "Exploratória: menos de 4 gl, RVE não confiável"
  tyszler: "Os dois efeitos de {{numeros.tyszler_rotulo}} foram lidos de figura. Cada meta herda a certeza da sua célula, que é muito baixa."
  legenda: "g de Hedges por efeito, com IC 95%, e a estimativa combinada (losango vazado). A faixa cinza marca ±δ."
  loo: "Deixando um estudo de fora"
  loo_sem: "sem"
  loo_muda: "o IC deixa de cruzar zero"
  delta: "faixa de ±δ"

