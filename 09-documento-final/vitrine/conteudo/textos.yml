  titulo: "O método em 60 segundos"
  intro: >-
    A revisão foi feita entre {{numeros.data_inicio}} e {{numeros.data_fim}}, com agentes de IA em quase todas as etapas.
    O autor aprovou a pergunta e o protocolo; o resto passou por portões aprovados em modo automático.
  nota: "O log registrava decisões de triagem como humanas; a Emenda 6a corrigiu."
  legenda: "Portões, emendas e saídas finais de script ao longo da revisão, por quem decidiu (horário do log, UTC)."
  raias:
    humano: "Humano"
    ia: "IA"
    script: "Script"
    emendas: "Emendas"
  sessao: "sessão de 23 e 24/09: Emenda 6, re-extração cega e arbitragem dos efeitos, síntese e GRADE refeitos"
  intervalo: "sem eventos no log"
  emenda_sem_log: "registrada no protocolo, sem evento próprio no log"
  gravado_humano: "gravado como humano no log; a decisão foi da IA"
  emendas:
    E001: "ajuste da busca em inglês"
    E002: "busca em inglês substituída"
    "Emenda 1": "apuração parcial passa a ser exposição elegível"
    "Emenda 2": "três variáveis de extração redefinidas"
    "Emenda 3": "codebooks de risco de viés no protocolo"
    "Emenda 4": "convenções de síntese"
    "Emenda 5": "síntese pelas células do protocolo"
    "Emenda 6": "correção de atribuição e registros sem resumo"

brasil:
  kicker: "Contexto"
  titulo: "A controvérsia no Brasil"
  intro: >-
    As regras de divulgação de pesquisas voltam ao debate a cada eleição em que as urnas se afastam das estimativas.
    Os eventos abaixo foram conferidos em fonte primária.
  itens:
    - ano: 1997
      texto: "A Lei das Eleições (Lei nº 9.504) passa a exigir o registro de cada pesquisa na Justiça Eleitoral antes da divulgação."
      confirmar: "Lei nº 9.504, de 30 de setembro de 1997"
    - ano: 2006
      texto: "A minirreforma eleitoral (Lei nº 11.300) veda a divulgação de pesquisas a partir do décimo quinto dia anterior ao pleito."
      confirmar: "a partir do décimo quinto dia anterior"
    - ano: 2006
      texto: "O STF julga a ADI 3.741 e derruba a vedação, com base no direito do eleitor à informação."
      confirmar: "configurava restrição ao direito dos eleitores à informação"
    - ano: 2018
      texto: "Urnas atrasadas seguem votando enquanto a apuração parcial oficial já é divulgada. É o caso do único estudo brasileiro incluído."
      confirmar: "apuração parcial oficial divulgada em 2018"
      fonte_confirmar: "09-documento-final/_revisao_final_v1_oqf.qmd"
    - ano: 2019
      texto: "O TSE edita a Resolução nº 23.600, que regula registro e divulgação de pesquisas e segue vigente com alterações."
      confirmar: "Resolução-TSE nº 23.600, de 12 de dezembro de 2019"
    - ano: 2022
      texto: "O primeiro turno diverge das estimativas de vários institutos. Projetos de lei na Câmara (PL nº 2.567/2022) e no Senado (PL nº 2.558/2022) propõem punir institutos cujas pesquisas saiam da margem de erro."
      confirmar: "Após o primeiro turno das eleições de 2022"

