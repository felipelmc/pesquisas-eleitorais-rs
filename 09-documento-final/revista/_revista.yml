# Metadados comuns ao artigo (revisao_final.qmd) e ao suplemento (suplemento.qmd).
lang: pt-BR
date-format: "DD/MM/YYYY"
language:
  title-block-published: "Versão"
  title-block-author-single: "Autor"
author:
  - name: Felipe Lamarca
    affiliations:
      - name: MAPE/IESP-UERJ
  - name: Lucas Berti
    affiliations:
      - name: IESP-UERJ
# estado: final (versão de entrega, Emenda 7): sem marca-d'água nem cabeçalho de rascunho; a marca
# "RASCUNHO NÃO VALIDADO" fica só na abertura da declaração de uso de IA (R7.23). Lido por
# montar_revisao_final.py, conferir_reestruturacao.py, verificar_pdf.py e barra_publicacao.py.
estado: final
revista:
  masthead: "Documento de trabalho · Síntese sistemática de evidências"
  cabeca: "Lamarca e Berti · Pesquisas eleitorais e voto"
  nota-ia: "A escrita dessa síntese de evidências se valeu amplamente do uso de modelos de inteligência artificial. Para mais detalhes, ver a declaração de uso de IA, nas Informações adicionais."
  ultima-busca: "19/09/2026 (bases) e 20/09/2026 (busca por citação)"
csl: revista/american-political-science-association.csl
link-citations: true
tbl-cap-location: top
crossref:
  custom:
    - kind: float
      key: qdr
      reference-prefix: Quadro
      caption-prefix: Quadro
      caption-location: top
      space-before-numbering: true
format:
  typst:
    papersize: a4
    fontsize: 10pt
    number-sections: true
    section-numbering: "1.1.1"
    toc: false
    citeproc: true
    font-paths: [revista/fontes/otf]
    template-partials: [revista/typst-template.typ, revista/typst-show.typ]
    filters:
      - at: pre-quarto
        path: revista/inline.lua
    default-image-extension: svg
    keep-typ: true
  html:
    theme: [cosmo, revista/revista.scss]
    css: revista/fontes_web.css
    toc: true
    toc-location: left
    toc-depth: 3
    number-sections: true
    citations-hover: true
    crossrefs-hover: true
    fig-cap-location: bottom
    format-links: false
    embed-resources: true
    default-image-extension: png
    filters:
      - at: pre-quarto
        path: revista/inline.lua
  docx:
    default-image-extension: png
    filters:
      - at: pre-quarto
        path: revista/inline.lua
