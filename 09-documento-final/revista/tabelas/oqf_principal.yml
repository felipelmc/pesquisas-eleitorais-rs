# Tab. 4 (tbl-oqf): caixa de ferramentas no formato OQF para a pergunta principal
# (pesquisa pré-eleitoral × apoio a quem aparece à frente). Lida por montar_revisao_final.py (@@TABELA oqf_principal@@).
# A prosa é editável pelo passe de estilo; os números entram por marcadores que o montador resolve lendo os arquivos:
#   {num:caminho}   09-documento-final/insumos/tabelas/numeros.json (ex.: {num:meta.g}, {num:meta.ic.0})
#   {calc:nome}     valores calculados pelo montador a partir de 06-analise/caixa_ferramentas.csv,
#                   09-documento-final/insumos/caixa_oqf.json e revista/celulas.json:
#                     forca                 rótulo e força da caixa por classe de desenho (regra caixa-3)
#                     n_celulas, n_estudos  células e estudos de pesquisa pré-eleitoral × apoio (principal, viabilidade, momentum)
#                     certezas              níveis de certeza dessas células, por extenso
#                     rotulo_implementacao, rotulo_custo   rótulos que a caixa gerada registra nessas linhas
# Sem caminhos de arquivo: a coluna "evidencia" aponta para seções do artigo (@sec-...), figuras e tabelas, e para o
# suplemento em texto.
legenda: >-
  Caixa de ferramentas no formato OQF para a pergunta principal (pesquisa pré-eleitoral e apoio a quem aparece à
  frente). Os rótulos seguem a regra `caixa-3`. A "Força" traduz a certeza em palavras (insuficiente para muito
  baixa). A certeza GRADE, que qualifica a direção, é rascunho de IA não validado.
larguras: [12, 50, 24, 14]
linhas:
  - dimensao: Escala
    resultado: >-
      Não estimada. Não há meta-análise principal, e as duas metas exploratórias, com {num:meta.k_estudos} estudos
      cada e menos de 4 graus de liberdade, não informam o tamanho
    evidencia: "@sec-apoio; @fig-metas; suplemento, S6"
    certeza: "muito baixa (a das células)"
  - dimensao: Força
    resultado: >-
      Inconclusivo ({calc:forca}). São {calc:n_celulas} células com {calc:n_estudos} estudos, somando o alvo
      principal, a viabilidade e o *momentum*
    evidencia: "@sec-efeito; @tbl-sof; suplemento, S9"
    certeza: "{calc:certezas} em todas as células"
  - dimensao: Mecanismo
    resultado: >-
      Descritivo. Voto estratégico e viabilidade é o canal com mais estudos e com testes diretos em laboratório, dois
      deles contados nas células de apoio principal. A heurística de consenso tem uma manipulação, em vinheta
      [@Lammers2022a]. Nenhum estudo isolou a conformidade
    evidencia: "@sec-mecanismo; @tbl-hipoteses"
    certeza: "sem GRADE (descritivo)"
  - dimensao: Moderador
    resultado: >-
      Descritivo. No alvo principal, todos os estudos hipotéticos ou induzidos vão na direção *bandwagon*, e o único
      experimento em contexto real é uma votação experimental com organizações reais, sem eleição [@Farjam2020a]. O
      partidarismo não atenuou o efeito no único teste pré-especificado dentro da síntese principal [@Cornejo2023a].
      Nenhum moderador teve estudos suficientes para teste
    evidencia: "@sec-moderadores; @fig-realismo"
    certeza: "sem GRADE (descritivo)"
  - dimensao: Implementação
    resultado: >-
      Não se aplica. A exposição a pesquisas não é um programa implementado por um gestor. A caixa gerada registra
      "{calc:rotulo_implementacao}" por falta das variáveis de implementação
    evidencia: "@sec-percepcao"
    certeza: "não se aplica"
  - dimensao: Percepção
    resultado: >-
      Não se aplica. A revisão é só de efeito e não sintetizou achados qualitativos sobre como os eleitores percebem
      as pesquisas
    evidencia: "@sec-percepcao"
    certeza: "não se aplica"
  - dimensao: Custo
    resultado: >-
      Não se aplica à exposição. A caixa gerada registra "{calc:rotulo_custo}" porque não há dado de custo no
      fichamento
    evidencia: "@sec-percepcao; suplemento, S9"
    certeza: "não se aplica"
