# Tab. 5 (tbl-transferibilidade): os 4 fatores de transferibilidade do protocolo (00-protocolo/protocolo.md, seção 9:
# voto obrigatório; sistema majoritário de dois turnos para cargos executivos; regulação da divulgação de pesquisas;
# confiança nas pesquisas) × como o Brasil é × quantos estudos incluídos têm a condição × o que se pode dizer.
# Lida por montar_revisao_final.py (@@TABELA transferibilidade@@). Textos editáveis pelo passe de estilo; sem juízo de
# preocupação.
# Marcadores que o montador resolve:
#   {nv2:nome}     valor formatado da entrada `nome` de revista/numeros_v2.json (contagens calculadas em
#                  gerar_numeros_v2.py, função transferibilidade(), com a fórmula registrada em cada entrada)
#   {nv2cit:nome}  as chaves da mesma entrada como citação [@a; @b]
#   {num:caminho}  insumos/tabelas/numeros.json
# "brasil" usa só itens confirmados em insumos/contexto_brasil.md; quando o levantamento de contexto não trata do
# fator, o texto diz isso e usa só o que o fichamento de um estudo incluído registra com trecho literal.
legenda: >-
  Fatores de transferibilidade previstos no protocolo e a evidência incluída. As contagens vêm da codificação dos
  estudos no fichamento por IA, não conferida por humano. O juízo de preocupação por fator não foi feito e fica
  com o autor.
larguras: [14, 32, 24, 30]
linhas:
  - fator: Voto obrigatório
    brasil: >-
      O levantamento de contexto desta revisão não tratou deste fator. O único estudo brasileiro incluído registra
      que o voto é obrigatório, com multa pequena para quem não vota [@Araujo2021a].
    estudos: >-
      {nv2:transf_voto_obrigatorio_sim} de {num:estudos} estudos têm voto obrigatório codificado
      {nv2cit:transf_voto_obrigatorio_sim}, dois deles por regra do jogo de laboratório, e
      {nv2:transf_voto_obrigatorio_informado} informam o dado. Nenhum dos {nv2:transf_comparecimento_sintese}
      estudos de comparecimento da síntese principal tem voto obrigatório codificado (2 sem voto obrigatório e 9 sem
      a informação)
    dizer: >-
      A hipótese de que o voto obrigatório elimina o canal da desmobilização não pode ser examinada com estes
      estudos. O estudo brasileiro não teve o comparecimento como desfecho extraído.
    fonte: >-
      brasil: fichamento de Araujo2021a, voto_obrigatorio__evidencia ("although voting is compulsory, the penalty
      for not voting is a small", p. 5); contexto_brasil.md não trata do voto obrigatório. estudos: numeros_v2.json
      (transferibilidade); "dois deles por regra do jogo": fichamentos de Feltovich2022 e Tyszler2015
      (voto_obrigatorio__evidencia). dizer: v1 do documento final, seção sobre o debate brasileiro
  - fator: Dois turnos
    brasil: >-
      Eleição presidencial em dois turnos, como em 2018, quando o estudo brasileiro mediu os dois
      [@Araujo2021a], e em 2022, quando a divergência entre as pesquisas e o resultado do primeiro turno levou a
      acusações contra os institutos [@PereiraNunes2024].
    estudos: >-
      {nv2:transf_dois_turnos} de {num:estudos} estudos em sistema de maioria em dois turnos
      {nv2cit:transf_dois_turnos}
    dizer: >-
      O estudo brasileiro encontrou a mesma direção nos dois turnos. Os experimentos de viabilidade vêm de sistemas
      de pluralidade [@Cornejo2023a; @Schlegel2023] ou proporcionais [@Freden2024a]. Nenhum deles trata do primeiro
      turno de uma eleição em dois turnos, onde opera o voto útil a que @PereiraNunes2024 atribuem parte da distância
      entre pesquisas e urnas em 2022.
    fonte: >-
      brasil: contexto_brasil.md, seções 3 e 4 (primeiro turno de 2022; Pereira e Nunes 2024); Araujo2021a nos dois
      turnos de 2018: efeitos E01 e E06 (mecanismos_moderadores.md, 2.6). estudos: numeros_v2.json. dizer: v1 do
      documento final ("Dois turnos"), fichamento (sistema_eleitoral de Cornejo2023a, Schlegel2023 e Freden2024a) e
      contexto_brasil.md, seção 4 (voto estratégico em Pereira e Nunes 2024)
  - fator: Regulação da divulgação
    brasil: >-
      Registro prévio obrigatório de cada pesquisa na Justiça Eleitoral, até cinco dias antes da divulgação
      [@Brasil1997Lei9504; @TSE2019Res23600]. Não há período de embargo desde 2006, quando o STF derrubou a
      proibição de divulgar pesquisas nos quinze dias anteriores ao pleito [@STF2006ADI3741]. No dia da eleição,
      levantamentos feitos naquele dia só podem ser divulgados a partir das 17h de Brasília [@TSE2019Res23600].
      Desde 2022, a votação termina e a apuração começa a ser divulgada às 17h de Brasília em todo o país
      [@TSE2021Res23669]. Dois projetos de lei de 2022 propõem punir pesquisas que divirjam do resultado além da
      margem de erro, e nenhum deles tinha sido votado em plenário na consulta de 24/09/2026
      [@BrasilCamara2022PL2567; @BrasilSenado2022PL2558].
    estudos: >-
      {nv2:transf_regulacao} estudos com variação vinda de regra de divulgação: proibição de boca de urna
      {nv2cit:transf_regulacao_proibicao} e embargo de pesquisas {nv2cit:transf_regulacao_embargo}. Desses,
      {nv2:transf_regulacao_na_sintese} estão na síntese principal
    dizer: >-
      Nenhum estudo avalia a regulação brasileira. As proibições de divulgar pesquisa de boca de urna antes do
      fechamento, na França e na Índia, correspondem a uma restrição que o Brasil já tem e foram em direções opostas
      no apoio ao líder (certeza muito baixa). O corte transversal de 46 países ficou fora da contagem [@Lago2015].
      Já @Araujo2021a trata da divulgação da apuração com eleitores ainda na fila, em 2018, antes da unificação de
      horário.
    fonte: >-
      brasil: contexto_brasil.md, seções 1, 2, 3 e 7 (7.1, 7.3 e 7.4); estudos: numeros_v2.json (transf_regulacao*);
      dizer: v1 do documento final ("Regulação da divulgação"), celulas.json (C05), contexto_brasil.md, seção 7.3, e
      fichamento de Araujo2021a (intervencao_descricao)
  - fator: Confiança nas pesquisas
    brasil: >-
      O levantamento de contexto não traz medida da confiança do público nas pesquisas. Depois do primeiro turno de
      2022, houve projetos de lei e um pedido de CPI contra os institutos [@BrasilCamara2022PL2567;
      @SenadoNoticias2022CPIPesquisas]. Entre 2012 e 2020, o desempenho das pesquisas brasileiras foi comparável ao
      de outros países [@Meireles2022].
    estudos: >-
      {nv2:transf_confianca} estudo relata a confiança nas pesquisas como moderador {nv2cit:transf_confianca}, em
      risco de viés crítico
    dizer: >-
      A teoria prevê efeito menor quando a confiança é baixa, mas esse moderador foi relatado por um único estudo e
      não foi sintetizado.
    fonte: >-
      brasil: contexto_brasil.md, seções 3 e 4; estudos: numeros_v2.json (transf_confianca) e numeros.json
      (criticos); dizer: v1 do documento final ("Confiança nas pesquisas") e teoria_programa.md, tabela Z
